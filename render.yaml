# Render blueprint — connect repo at https://dashboard.render.com
# New → Blueprint → eshaantrmukku-del/valora
services:
  - type: web
    name: valora
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Optional — add in Render dashboard for LLM photo analysis:
      # - key: OPENAI_API_KEY
      #   sync: false
